<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="LOGO MINIMALISTA.png">
    <title>Login - PSTEC Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pstec: { 700: '#003B96', 800: '#002b70', 900: '#001b4a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden">
        <div class="bg-pstec-700 p-6 text-center text-white">
            <div class="flex justify-center mb-3">
                <img src="./logo.png" alt="PSTEC" class="h-10 object-contain bg-white p-1 rounded-xl shadow-xs" onerror="this.style.display='none'">
            </div>
            <h1 class="text-xl font-extrabold tracking-wide">PSTEC Brasil</h1>
            <p class="text-xs text-slate-200 mt-1">Acesso ao Controle de Produção</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Usuário:</label>
                <input type="text" id="inputUsuario" required placeholder="Digite seu usuário GRV..." 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 text-xs focus:outline-none focus:border-pstec-700 font-bold uppercase">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Senha:</label>
                <input type="password" id="inputSenha" required placeholder="Digite sua senha GRV..." 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 text-xs focus:outline-none focus:border-pstec-700 font-medium">
            </div>

            <p id="msgError" class="text-red-600 font-bold text-center hidden bg-red-50 p-2.5 rounded-xl border border-red-200"></p>

            <button type="submit" id="btnLogin" class="w-full py-3 bg-pstec-700 text-white font-extrabold rounded-xl hover:bg-pstec-800 transition shadow-md text-xs">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('inputUsuario').value.trim().toUpperCase();
            const senha = document.getElementById('inputSenha').value;
            
            const msgError = document.getElementById('msgError');
            const btnLogin = document.getElementById('btnLogin');

            msgError.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Autenticando...';

            try {
                const response = await fetch('https://pstec.consultoriarf.net/producao/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Usuário ou senha inválidos.');
                }

                // Salva Token, Nome do Usuário e Permissões U_FATURAMENTO / U_FINALIZACAO no localStorage
                localStorage.setItem('pstec_token', data.access_token);
                localStorage.setItem('pstec_usuario_nome', data.usuario);
                localStorage.setItem('pstec_perm_faturamento', data.u_faturamento ?? 0);
                localStorage.setItem('pstec_perm_finalizacao', data.u_finalizacao ?? 0);

                window.location.href = 'index.html';

            } catch (error) {
                msgError.textContent = error.message;
                msgError.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar no Sistema';
            }
        }
    </script>
</body>
</html>
